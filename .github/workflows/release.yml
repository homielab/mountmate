name: release

# Push a version tag to release:
#   git tag v5.21 && git push origin v5.21
# The version comes from the tag, the build number is bumped automatically,
# and the GitHub release is published with that version's CHANGELOGS.md
# section only after the app is built, signed and notarized.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # commit the version bump, move the tag, publish the release

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          if [[ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::${TAG} must point to the latest commit on main. Tag main's HEAD and push again."
            exit 1
          fi

      - name: Set version and build number, extract release notes
        id: version
        run: ./scripts/prepare-release.sh "${{ github.ref_name }}"

      - name: Install Dependencies
        run: |
          brew install create-dmg

          # Download Sparkle tools to get generate_appcast
          wget https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz
          mkdir -p sparkle-tools
          tar -xf Sparkle-2.9.5.tar.xz -C sparkle-tools
          echo "$PWD/sparkle-tools/bin" >> $GITHUB_PATH

      - name: Setup Code Signing
        env:
          P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

          # Add to search list
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Setup Notarytool Credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "MountMateProfile" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Setup Environment Variables
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo 'CERTIFICATE_NAME="Developer ID Application"' >> .env.local
          echo 'NOTARY_PROFILE="MountMateProfile"' >> .env.local
          echo "SPARKLE_PRIVATE_KEY=\"$RUNNER_TEMP/sparkle_private_key.pem\"" >> .env.local

          echo "$SPARKLE_KEY" > $RUNNER_TEMP/sparkle_private_key.pem

      - name: Create App
        run: ./scripts/1-create-app.sh

      - name: Build Release (DMG & Zip & Appcast)
        run: ./scripts/2-build.sh

      - name: Generate Cask
        run: ./scripts/4-generate_cask.sh

      # Everything below runs only after a successful build.

      - name: Commit version bump, appcast and cask; move tag to release commit
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD: ${{ steps.version.outputs.BUILD }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add MountMate.xcodeproj/project.pbxproj docs/appcast.xml Casks/mountmate.rb
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "release ${TAG} (${BUILD})"
            git push origin HEAD:main
          fi
          # Point the tag at the commit that matches the shipped build.
          # (Pushes made with GITHUB_TOKEN do not re-trigger this workflow.)
          git tag -f -a "${TAG}" -m "MountMate ${VERSION} (${BUILD})"
          git push -f origin "refs/tags/${TAG}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ASSETS=(Dist/Final/MountMate_"${VERSION}".zip Dist/Final/MountMate_"${VERSION}".dmg)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "MountMate ${VERSION}" \
              --notes-file RELEASE_NOTES.md --draft=false --latest
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "MountMate ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag --latest
          fi
