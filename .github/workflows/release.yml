name: release

# Push a version tag to release:
#   git tag v5.21 && git push origin v5.21
# The version comes from the tag, the build number is bumped automatically,
# and the GitHub release is published with that version's CHANGELOG.md
# section only after the tests pass and the app is built, signed and notarized.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag's commit was usually tested already by the push to main: reuse
  # that green run (waiting for it if it is still running) instead of a second
  # macOS run. No green run for this commit -> run the tests here.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    outputs:
      need_tests: ${{ steps.check.outputs.need_tests }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs() {
            gh api "repos/${REPO}/actions/workflows/test.yml/runs?head_sha=${SHA}&event=push" \
              --jq '[.workflow_runs[] | select(.head_branch == "main")]'
          }
          for _ in $(seq 1 70); do
            R="$(runs)"
            if [[ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$R")" -gt 0 ]]; then
              echo "Tests already passed on main for ${SHA}."
              echo "need_tests=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [[ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$R")" -eq 0 ]]; then
              break
            fi
            echo "Test run on main still running; waiting."
            sleep 30
          done
          echo "No green test run for ${SHA}; running tests in the release."
          echo "need_tests=true" >> "$GITHUB_OUTPUT"

  # Unit tests and the style check; nothing is built or signed if they fail.
  test:
    needs: ci
    if: needs.ci.outputs.need_tests == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    needs: [ci, test]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write # commit the version bump, move the tag, publish the release

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin main
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "::error::${TAG} must point to a commit on main."
            exit 1
          fi

      - name: Set version and build number, extract release notes
        id: version
        run: ./scripts/prepare-release.sh "${{ github.ref_name }}"

      - name: Install Dependencies
        run: |
          brew install create-dmg

          # Download the Sparkle tools (generate_appcast) matching the framework
          # the app links. The version comes from Package.resolved, so bumping
          # the Sparkle package in Xcode updates both; never hard-code it here.
          SPARKLE_VERSION="$(jq -r '.pins[] | select(.identity == "sparkle") | .state.version' \
            MountMate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)"
          if [[ -z "${SPARKLE_VERSION}" || "${SPARKLE_VERSION}" == "null" ]]; then
            echo "::error::Could not read the Sparkle version from Package.resolved."
            exit 1
          fi
          echo "Sparkle tools ${SPARKLE_VERSION}"
          wget "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xf "Sparkle-${SPARKLE_VERSION}.tar.xz" -C sparkle-tools
          echo "$PWD/sparkle-tools/bin" >> $GITHUB_PATH

      - name: Setup Code Signing
        env:
          P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

          # Add to search list
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Setup Notarytool Credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "MountMateProfile" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Setup Environment Variables
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo 'CERTIFICATE_NAME="Developer ID Application"' >> .env.local
          echo 'NOTARY_PROFILE="MountMateProfile"' >> .env.local
          echo "SPARKLE_PRIVATE_KEY=\"$RUNNER_TEMP/sparkle_private_key.pem\"" >> .env.local

          echo "$SPARKLE_KEY" > $RUNNER_TEMP/sparkle_private_key.pem

      - name: Create App
        run: ./scripts/1-create-app.sh

      - name: Build Release (DMG & Zip & Appcast)
        run: ./scripts/2-build.sh

      - name: Generate Cask
        run: ./scripts/4-generate_cask.sh

      # Everything below runs only after a successful build.

      # The tag is left where it was pushed (GitHub rejects tag rewrites from
      # the workflow). The version bump, appcast and cask go onto main.
      - name: Commit version bump, appcast and cask to main
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          BUILD: ${{ steps.version.outputs.BUILD }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add MountMate.xcodeproj/project.pbxproj docs/index.html docs/appcast.xml Casks/mountmate.rb CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "release ${TAG} (${BUILD})"
          RELEASE_COMMIT="$(git rev-parse HEAD)"

          # Apply on top of the latest main (it may have moved since the tag).
          git fetch origin main
          git checkout -B release-main origin/main
          if ! git cherry-pick "${RELEASE_COMMIT}"; then
            if git diff --quiet && git diff --cached --quiet; then
              echo "main already has these changes."
              git cherry-pick --skip
              exit 0
            fi
            echo "::error::Could not apply the release commit on main (conflict). Update main by hand."
            git cherry-pick --abort
            exit 1
          fi
          git push origin HEAD:main

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ASSETS=(Dist/Final/MountMate_"${VERSION}".zip Dist/Final/MountMate_"${VERSION}".dmg)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "MountMate ${VERSION}" \
              --notes-file RELEASE_NOTES.md --draft=false --latest
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "MountMate ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag --latest
          fi

  # Publish the website (with the new appcast) only after the release and its
  # downloads exist, so Sparkle never offers an update that can't download.
  pages:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
