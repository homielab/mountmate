name: test

# Unit tests and code-style check for every pull request and push to main,
# and as a gate that the release workflow runs before it builds anything.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Lint (swift-format)
        run: swift format lint --strict -r MountMate MountMateTests

      - name: Unit tests
        run: >
          xcodebuild test
          -project MountMate.xcodeproj
          -scheme MountMate
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=NO
