name: test

# Unit tests and code-style check for every pull request and push to main.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint (swift-format)
        # Not strict yet: the code base still has style findings (see README).
        run: swift format lint -r MountMate MountMateTests

      - name: Unit tests
        run: >
          xcodebuild test
          -project MountMate.xcodeproj
          -scheme MountMate
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          -only-testing:MountMateTests
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=NO
