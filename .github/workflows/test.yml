name: test

# Unit tests and code-style check for pull requests, pushes to main and
# ci/** branches (to try workflow changes), and as the release gate.
# Site, docs and cask edits don't touch the app, so they don't run it.

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "Casks/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main, "ci/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "Casks/**"
      - ".github/workflows/pages.yml"
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Lint (swift-format)
        run: swift format lint --strict -r MountMate MountMateTests

      # Swift packages (Sparkle) resolved once per Package.resolved.
      - uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('MountMate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Unit tests
        run: >
          xcodebuild test
          -project MountMate.xcodeproj
          -scheme MountMate
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=NO
